; Eco-Sense ESP32 field node — PlatformIO scaffold (ECO-022)

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
  -D ECO_CONTRACT_VERSION=\"v1\"
  -D ECO_DEFAULT_DEVICE_ID=\"STATION_01\"
lib_deps =

[env:esp32dev-test]
extends = env:esp32dev
build_flags =
  ${env:esp32dev.build_flags}
  -D ECO_INGEST_URL=\"https://YOUR_PROJECT_REF.supabase.co/functions/v1/edge-ingest\"
  -D ECO_DEVICE_SECRET=\"station-secret-01\"
