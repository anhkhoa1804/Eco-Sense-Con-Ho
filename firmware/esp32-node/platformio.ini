; HORIZON ESP32 field nodes.
;
; src/ contains one .ino per physical node (gateway, trạm 1, trạm 2) plus no
; shared scaffold. PlatformIO compiles every file in src/ for a given
; environment by default, and each .ino defines its own setup()/loop(), so
; building without a filter produces duplicate-symbol errors. Each
; environment below selects exactly one .ino via build_src_filter.
;
; NOTE: not verified against a real `pio run` in this session (no PlatformIO/
; ESP32 toolchain available here) — confirm build_src_filter syntax handles
; the Vietnamese filenames with spaces correctly before flashing.

[platformio]
default_envs = station1

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =

[env:station1]
build_src_filter = +<*> -<gateway.ino> -<trạm 2.ino>

[env:station2]
build_src_filter = +<*> -<gateway.ino> -<trạm 1.ino>

[env:gateway]
build_src_filter = +<*> -<trạm 1.ino> -<trạm 2.ino>
