<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="HORIZON">
  <title>HORIZON</title>
  <!--
    The HORIZON minimal mark: the green H monogram under an orange nón lá.

    This is a redraw of the project's own icon (horizon-icon.png in this
    folder), which in turn comes from the conical-hat form already sitting
    over the H in the full wordmark. Vector rather than raster so the tab
    favicon stays crisp at 16px, where the PNG's soft hand-drawn edges turn
    to mush.

    Nothing here is invented brand: the monogram, the hat and both colours
    all already exist in the wordmark.
  -->

  <rect width="512" height="512" rx="116" fill="#f4f1e8"/>

  <!-- H monogram. Rounded caps keep the handmade character of the original
       rather than turning it into a geometric sans letterform. -->
  <g fill="#2c9e57">
    <rect x="176" y="196" width="46" height="208" rx="21"/>
    <rect x="302" y="196" width="46" height="208" rx="21"/>
    <rect x="176" y="278" width="172" height="44" rx="20"/>
  </g>

  <!-- Nón lá, tilted over the H's left shoulder exactly as in the wordmark. -->
  <g transform="rotate(-13 232 168)">
    <path d="M232 96 L306 206 Q232 236 158 206 Z" fill="#f28c00"/>
    <!-- Ribs, a shade deeper so the cone reads as woven rather than flat. -->
    <g stroke="#d97a00" stroke-width="5" stroke-linecap="round" opacity="0.75">
      <line x1="232" y1="112" x2="196" y2="214"/>
      <line x1="232" y1="112" x2="232" y2="222"/>
      <line x1="232" y1="112" x2="268" y2="214"/>
    </g>
    <!-- Brim edge. -->
    <path d="M158 206 Q232 236 306 206" fill="none" stroke="#d97a00" stroke-width="7" stroke-linecap="round"/>
  </g>
</svg>
